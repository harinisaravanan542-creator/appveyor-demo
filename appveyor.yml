# appveyor.yml configuration
image: Visual Studio 2022 # The environment where the build runs

# What happens before the build (e.g., restoring dependencies)
before_build:
  - nuget restore

# The actual build command
build:
  project: YourProjectName.sln # Replace with your actual solution/project file
  verbosity: minimal

# Post-build actions
after_build:
  - echo "Build completed successfully!"
